name: Incident Switchboard

run-name: >-
  Incident Switchboard -
  ${{ github.event_name == 'workflow_dispatch'
      && (inputs.severity == 'high' && 'HIGH' || inputs.severity == 'medium' && 'MEDIUM' || 'LOW')
      || 'AUTOMATIC' }}
  ${{ github.event_name == 'workflow_dispatch' && inputs.deep_scan && 'SCAN' || '' }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      severity:
        description: 'Choose severity level'
        required: true
        default: 'low'
        type: choice
        options:
          - low
          - medium
          - high

      deep_scan:
        description: 'Request a deep scan'
        required: true
        default: false
        type: boolean

      skip_tests:
        description: 'Skip tests'
        required: true
        default: false
        type: boolean

      reason:
        description: 'Provide a reason for the run'
        required: false
        type: string

jobs:

  # =========================
  # JOB 1: TRIAGE
  # =========================
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Print run information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run number: ${{ github.run_number }}"

      - name: Print manual run information
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Severity: ${{ inputs.severity }}"
          echo "Deep scan: ${{ inputs.deep_scan }}"
          echo "Tests skipped: ${{ inputs.skip_tests }}"
          echo "Reason: ${{ inputs.reason }}"

      - name: Print automatic run information
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "This run was automatic and no reason was supplied."

      - name: Low severity
        if: github.event_name != 'workflow_dispatch' || inputs.severity == 'low'
        run: echo "Low severity incident."

      - name: Medium severity
        if: github.event_name == 'workflow_dispatch' && inputs.severity == 'medium'
        run: echo "Medium severity incident."

      - name: High severity
        if: github.event_name == 'workflow_dispatch' && inputs.severity == 'high'
        run: echo "High severity incident."


  # =========================
  # JOB 2: TESTS
  # =========================
  tests:
    needs: triage
    runs-on: ubuntu-latest

    if: |
      github.event_name != 'workflow_dispatch' ||
      !inputs.skip_tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: react-app
        run: npm install

      - name: Run test suite
        working-directory: react-app
        run: npm test


  # =========================
  # JOB 3: SCAN
  # =========================
  scan:
    needs: triage
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' &&
      (inputs.deep_scan || inputs.severity == 'high')

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create scan.json
        env:
          SEVERITY: ${{ inputs.severity }}
          DEEP_SCAN: ${{ inputs.deep_scan }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat > scan.json <<EOF
          {
            "severity": "$SEVERITY",
            "deep_scan": $DEEP_SCAN,
            "actor": "$ACTOR",
            "run_number": $RUN_NUMBER,
            "time_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Read values with jq
        run: |
          echo "Severity: $(jq -r '.severity' scan.json)"
          echo "Run number: $(jq -r '.run_number' scan.json)"


  # =========================
  # JOB 4: REPORT
  # =========================
  report:
    needs:
      - tests
      - scan

    runs-on: ubuntu-latest

    if: always()

    steps:
      - name: Report tests status
        run: |
          if [ "${{ needs.tests.result }}" = "success" ]; then
            echo "Tests: succeeded"
          elif [ "${{ needs.tests.result }}" = "skipped" ]; then
            echo "Tests: skipped"
          else
            echo "Tests: failed"
          fi

      - name: Report scan status
        run: |
          if [ "${{ needs.scan.result }}" = "success" ]; then
            echo "Scan: succeeded"
          elif [ "${{ needs.scan.result }}" = "skipped" ]; then
            echo "Scan: skipped"
          else
            echo "Scan: failed"
          fi

      - name: Print summary
        run: |
          if [ "${{ needs.tests.result }}" != "failure" ] && \
             [ "${{ needs.scan.result }}" != "failure" ]; then
            echo "Everything that ran was successful."
          else
            echo "One or more jobs failed."
          fi

      - name: Close switchboard
        run: echo "Switchboard closed"