name: Ordered Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup done
        run: |
          echo "Setup done"

      # Deliberately fail the setup job
      - name: Deliberate failure
        run: exit 1

  verify:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify
        run: |
          python --version
          echo "Verify done"

  finish:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Finish
        run: echo "Pipeline finished"